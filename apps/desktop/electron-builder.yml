appId: net.perfer.lila-modeler
productName: Lila Modeler
# El nombre del paquete (@lila/desktop) no sirve como nombre de ejecutable: el
# @ y la / rompen el AppImage en Linux ("executableName contains characters
# that cannot be safely used in file paths"). Fijamos un nombre válido en las
# tres plataformas (#73); productName y artifactName no cambian.
executableName: lila-modeler
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
# Sin icono propio (pendiente #76): electron-builder usa el icono por defecto de Electron.
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
  category: public.app-category.productivity
  identity: null
fileAssociations:
  - ext: bpmn
    name: BPMN Diagram
    role: Editor
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  target: nsis
# ponytail: solo AppImage. El target "deb" usa fpm, que exige "homepage" y
# "author.email" en package.json (fallan el build con "Please specify
# project homepage" / "Please specify author 'email'") — son datos de
# publicación que este ticket (#73, CI en verde) no decide. Reintroducir
# "deb" cuando haya homepage/autor reales para el paquete.
linux:
  target:
    - AppImage
  category: Office
publish: null
