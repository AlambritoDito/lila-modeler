name: Pages

on:
  pull_request:
    paths: ['apps/web/**', 'packages/engine/**', 'examples/**', 'site/**', 'docs/design/en/**', 'docs/design/branding/**', 'tools/build-pages.mjs', 'package*.json', '.github/workflows/pages.yml']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed demo (requires GitHub Pages configured for Actions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record the source being built
        run: |
          echo "ref=${{ github.ref }} sha=${{ github.sha }} head=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: npm ci
      - run: node tools/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Build and upload by default. The owner publishes manually after review, from `main` or
    # from a validated release tag (`gh workflow run pages.yml --ref v1.0.0-beta.1 -f publish=true`
    # takes this workflow file and the site source from that exact tag). Automatic publication
    # on push stays behind the PAGES_PUBLISH_ENABLED repository variable.
    if: (github.event_name == 'workflow_dispatch' && inputs.publish && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH_ENABLED == 'true')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
