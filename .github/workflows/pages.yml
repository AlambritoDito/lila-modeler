name: Pages

on:
  pull_request:
    paths: ['apps/web/**', 'packages/engine/**', 'examples/**', 'site/**', 'docs/design/en/**', 'tools/build-pages.mjs', 'package*.json', '.github/workflows/pages.yml']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed demo (requires GitHub Pages configured for Actions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tools/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Build and upload by default. The owner enables publication only after review.
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.PAGES_PUBLISH_ENABLED == 'true'))
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
