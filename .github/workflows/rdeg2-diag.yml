name: RDEG2 diag (temporal)

on:
  push:
    branches: [lila-rdeg2-plataforma]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx tools/dump-nivel3.ts linux.json
      - run: npx tsx tools/diag-rows.ts linux-rows.txt
      - run: sha256sum linux.json linux-rows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nivel3-linux
          path: |
            linux.json
            linux-rows.txt
