name: Release

# The owner creates the release tag and configures NPM_TOKEN after approving publication.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Publication is opt-in: the owner has not created NPM_TOKEN nor settled the npm org, so
    # the alpha tag proves the package builds and packs without pushing anything to a registry.
    # Secrets are unavailable to `if:` directly, so the job exposes the token as an env var and
    # the publish step tests that instead.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release versions
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME.slice(1);
          for (const file of ['packages/engine/package.json', 'apps/desktop/package.json']) {
            const { version } = JSON.parse(readFileSync(file, 'utf8'));
            if (version !== tag) throw new Error(`${file}: ${version} differs from tag ${tag}`);
          }
          JS
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --workspace @lila/engine --dry-run
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --workspace @lila/engine --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Report that publication was skipped
        if: env.NPM_TOKEN == ''
        run: |
          echo "::notice title=npm publish skipped::NPM_TOKEN is not configured, so @lila/engine was not published. The tag still proved that the package builds, type-checks, tests and packs. Add the NPM_TOKEN secret and re-run this workflow to publish."
