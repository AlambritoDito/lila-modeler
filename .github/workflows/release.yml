name: Release

# A `v*` tag only proves the package builds, type-checks, tests and packs. Nothing is
# published from a tag: pushing `v1.0.0-beta.1` must not touch the npm registry nor advance
# its `latest` dist-tag. npm publication is a separate, explicit owner action: run this
# workflow manually with `publish_npm: true` on a `v*` tag. Authentication is npm trusted
# publishing (OIDC): no token is stored; npmjs.com trusts this repository and this workflow file.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish @lila-modeler/engine and @lila-modeler/mcp to npm (owner decision; run it on a v* tag ref)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH_NPM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which trusted publishing needs (>= 11.5.1).
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release versions
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const ref = process.env.GITHUB_REF_NAME;
          const expected = process.env.GITHUB_REF_TYPE === 'tag' && ref.startsWith('v') ? ref.slice(1) : undefined;
          const versions = {};
          for (const file of ['packages/engine/package.json', 'packages/mcp/package.json', 'apps/web/package.json', 'apps/desktop/package.json']) {
            versions[file] = JSON.parse(readFileSync(file, 'utf8')).version;
          }
          versions['packages/engine/src/version.ts'] = /version = '([^']+)'/.exec(readFileSync('packages/engine/src/version.ts', 'utf8'))[1];
          versions['packages/mcp/src/server.ts'] = /const VERSION = '([^']+)'/.exec(readFileSync('packages/mcp/src/server.ts', 'utf8'))[1];
          const distinct = new Set(Object.values(versions));
          console.log(versions);
          if (distinct.size !== 1) throw new Error(`Release manifests disagree: ${JSON.stringify(versions)}`);
          if (expected !== undefined && !distinct.has(expected)) throw new Error(`Manifests say ${[...distinct][0]} but the tag is ${ref}`);
          JS
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:package
      - run: npm pack --workspace @lila-modeler/engine --dry-run
      - run: npm pack --workspace @lila-modeler/mcp --dry-run
      - name: Publish to npm (explicit owner action only)
        if: env.PUBLISH_NPM == 'true'
        # A prerelease version (1.0.0-beta.1) goes to the `beta` dist-tag; a stable version goes
        # to `latest`. Moving `latest` along the beta line is the next step, on purpose: it can
        # fail (npm dist-tag answers E401 under OIDC) and must never keep a package from being
        # published (#649). Publication is only possible from a dispatch on a `v*` tag.
        # The engine goes first: @lila-modeler/mcp pins the same engine version, so it must exist
        # on the registry before the server that depends on it (ADR-030).
        run: |
          version=$(node -p "require('./packages/engine/package.json').version")
          tag=latest
          case "$version" in *-*) tag=$(echo "$version" | sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/');; esac
          npm --version
          for package in @lila-modeler/engine @lila-modeler/mcp; do
            # A rerun after a partial failure (the engine published, the server refused) must skip
            # what is already on the registry instead of failing on it before reaching the rest.
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version is already on the registry; skipping"
            else
              echo "Publishing $package@$version with dist-tag $tag"
              npm publish --workspace "$package" --provenance --access public --tag "$tag"
            fi
          done
      - name: Move latest during the beta line (never fails the job)
        if: env.PUBLISH_NPM == 'true'
        # While `latest` is itself a prerelease (the beta line before 1.0.0), it follows the newest
        # beta too, so `npx @lila-modeler/mcp` without `@beta` is current; once a stable version is
        # out, a beta never moves `latest` again. npm dist-tag does not always authenticate through
        # OIDC trusted publishing (E401 even with «Allow npm dist-tag»), so a failure here is only
        # a warning with the command to run by hand (2FA). A rerun also retries this step.
        run: |
          version=$(node -p "require('./packages/engine/package.json').version")
          case "$version" in
            *-*) ;;
            *) echo "$version is stable: the publish step already put it on latest"; exit 0;;
          esac
          for package in @lila-modeler/engine @lila-modeler/mcp; do
            latest=$(npm view "$package" dist-tags.latest --prefer-online 2>/dev/null || true)
            case "$latest" in
              "$version") echo "$package latest is already $version"; continue;;
              ''|*-*) ;;
              *) echo "$package latest is the stable $latest; a beta does not move it"; continue;;
            esac
            echo "Moving $package latest from ${latest:-nothing} to $version (no stable version yet)"
            moved=false
            # A fresh publish can take a while to become visible to the registry's other endpoints.
            for attempt in 1 2 3; do
              if npm dist-tag add "$package@$version" latest; then
                moved=true
                break
              fi
              if [ "$attempt" != 3 ]; then sleep 30; fi
            done
            if [ "$moved" != true ]; then
              echo "::warning title=latest not moved::$package@$version is published, but npm dist-tag add failed 3 times (E401 is usual under OIDC). Move latest by hand with 2FA: npm dist-tag add $package@$version latest"
            fi
          done
          exit 0
      - name: Report that publication was skipped
        if: env.PUBLISH_NPM != 'true'
        run: |
          echo "::notice title=npm publish skipped::@lila-modeler/engine and @lila-modeler/mcp were not published. Publication only happens from a manual run with publish_npm=true on a v* tag; a tag push only proves the package builds, type-checks, tests and packs."
