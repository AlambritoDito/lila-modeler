name: Release

# A `v*` tag only proves the package builds, type-checks, tests and packs. Nothing is
# published from a tag: pushing `v1.0.0-beta.1` must not touch the npm registry nor advance
# its `latest` dist-tag. npm publication is a separate, explicit owner action: run this
# workflow manually with `publish_npm: true` (it also requires the NPM_TOKEN secret).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish @lila/engine to npm (owner decision; requires NPM_TOKEN and a v* tag ref)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PUBLISH_NPM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm == true && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check release versions
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const ref = process.env.GITHUB_REF_NAME;
          const expected = process.env.GITHUB_REF_TYPE === 'tag' && ref.startsWith('v') ? ref.slice(1) : undefined;
          const versions = {};
          for (const file of ['packages/engine/package.json', 'packages/mcp/package.json', 'apps/web/package.json', 'apps/desktop/package.json']) {
            versions[file] = JSON.parse(readFileSync(file, 'utf8')).version;
          }
          versions['packages/engine/src/version.ts'] = /version = '([^']+)'/.exec(readFileSync('packages/engine/src/version.ts', 'utf8'))[1];
          const distinct = new Set(Object.values(versions));
          console.log(versions);
          if (distinct.size !== 1) throw new Error(`Release manifests disagree: ${JSON.stringify(versions)}`);
          if (expected !== undefined && !distinct.has(expected)) throw new Error(`Manifests say ${[...distinct][0]} but the tag is ${ref}`);
          JS
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:package
      - run: npm pack --workspace @lila/engine --dry-run
      - name: Publish to npm (explicit owner action only)
        if: env.PUBLISH_NPM == 'true' && env.NPM_TOKEN != ''
        # A prerelease version (1.0.0-beta.1) goes to the `beta` dist-tag so `latest` never
        # points at a beta; a stable version goes to `latest`. Publication is only possible from
        # a dispatch on a `v*` tag. Note: the registry sets `latest` on a package's very first
        # publish regardless of --tag; check `npm view @lila/engine dist-tags` after a first publish.
        run: |
          version=$(node -p "require('./packages/engine/package.json').version")
          tag=latest
          case "$version" in *-*) tag=$(echo "$version" | sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/');; esac
          echo "Publishing @lila/engine@$version with dist-tag $tag"
          npm publish --workspace @lila/engine --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Report that publication was skipped
        if: env.PUBLISH_NPM != 'true' || env.NPM_TOKEN == ''
        run: |
          echo "::notice title=npm publish skipped::@lila/engine was not published. Publication only happens from a manual run with publish_npm=true and the NPM_TOKEN secret; a tag push only proves the package builds, type-checks, tests and packs."
