name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # El build va antes de los tests: packages/mcp y apps/web consumen
      # @lila/engine por sus subpaths publicados (dist/), no por las fuentes.
      - run: npm run build
      - run: npm test
      # `tsc --build` solo cubre packages/engine: apps/web es `noEmit` y queda
      # fuera del build por proyectos. Sin este paso, un error de tipos en la
      # app web pasa el CI sin que nadie lo vea.
      - run: npm run typecheck
