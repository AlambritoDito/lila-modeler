name: Desktop

# Build unsigned installers on PRs and manual runs. Tags and manual runs then collect the release
# candidate: the macOS arm64 DMG, the Windows x64 NSIS installer and a SHA256SUMS covering both,
# plus the release notes from docs/releases/v<version>.md when that file exists. The candidate is
# uploaded as the CI artifact `lila-release-candidate-<sha>`, so a manual run on a branch rehearses
# a release without creating one. Only a `v*` tag ref (pushed, or a manual run on it) attaches the candidate to a DRAFT release (prerelease when
# the version has a suffix), never replacing assets and never touching a published release; the
# owner reviews the assets and publishes the release manually. The Windows installer is unsigned
# and untested by CI (SmartScreen warns on first run). Linux builds and `.blockmap` files stay CI
# artifacts only. Build and collect jobs run with read-only credentials; only the separate
# `release` job can write to the repository.
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --mac --arm64
          - os: windows-latest
            flags: --win
          - os: ubuntu-latest
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @lila-modeler/engine
      - run: npm run build -w @lila-modeler/web
      - run: npm run build -w @lila-modeler/desktop
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        working-directory: apps/desktop
      - name: Verify macOS artifact is arm64, ad-hoc signed and carries the tagged version
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ]; then test "v$version" = "$REF_NAME" || { echo "package version $version does not match tag $REF_NAME"; exit 1; }; fi
          dmg=$(ls release/*-mac-arm64.dmg)
          echo "DMG: $dmg"
          case "$dmg" in *"-${version}-mac-arm64.dmg") ;; *) echo "DMG name does not carry version $version"; exit 1;; esac
          case "$(basename "$dmg")" in *" "*) echo "DMG name must not contain spaces (GitHub renames them)"; exit 1;; esac
          app="release/mac-arm64/Lila Modeler.app"
          lipo -archs "$app/Contents/MacOS/Lila Modeler" | tee /dev/stderr | grep -qw arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict --verbose=2 "$app"
          shasum -a 256 "$dmg"  # SHA256SUMS is written by the collect job, over both installers
          cat release/ORIGEN.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: lila-desktop-${{ matrix.os }}-${{ github.sha }}
          path: apps/desktop/release/**
          if-no-files-found: error

  collect:
    # Gathers exactly what a release attaches. Runs on tags and on manual runs (to rehearse a
    # release); read-only, and its output is a CI artifact, never a release.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/package.json
            docs/releases
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: lila-desktop-macos-latest-${{ github.sha }}
          path: built/mac
      - uses: actions/download-artifact@v4
        with:
          name: lila-desktop-windows-latest-${{ github.sha }}
          path: built/win
      - name: Collect the DMG, the Windows installer, their checksums and the release notes
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          dmg="built/mac/Lila-Modeler-${version}-mac-arm64.dmg"
          exe="built/win/Lila-Modeler-${version}-win-x64.exe"
          for f in "$dmg" "$exe"; do
            test -f "$f" || { echo "::error::Missing $f"; ls -la built/mac built/win; exit 1; }
          done
          mkdir -p candidate/assets
          cp "$dmg" "$exe" candidate/assets/
          (cd candidate/assets && sha256sum -- *.dmg *.exe > SHA256SUMS && sha256sum -c SHA256SUMS && cat SHA256SUMS)
          test "$(wc -l < candidate/assets/SHA256SUMS)" -eq 2
          notes="docs/releases/v${version}.md"
          if [ -f "$notes" ]; then
            cp "$notes" candidate/notes.md
            echo "Release body: $notes"
          else
            msg="No $notes; the release body stays empty."
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::warning::$msg"; else echo "$msg"; fi
          fi
          ls -la candidate candidate/assets
      - uses: actions/upload-artifact@v4
        with:
          name: lila-release-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error

  release:
    # Only a tag publishes the collected candidate, only as a draft, never over a published release.
    if: github.ref_type == 'tag'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lila-release-candidate-${{ github.sha }}
          path: candidate
      - name: Refuse to touch a release that is already published
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # "not found" means the action will create the draft; any other failure is a real error.
          if out=$(gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>&1); then
            case "$out" in
              true) echo "Release $REF_NAME is a draft; assets may be added." ;;
              *) echo "::error::Release $REF_NAME is already published; assets are not replaced by CI."; exit 1 ;;
            esac
          else
            case "$out" in
              *"release not found"*|*"Not Found"*|*"HTTP 404"*) echo "No release $REF_NAME yet; the action creates a draft." ;;
              *) echo "::error::Could not inspect release $REF_NAME: $out"; exit 1 ;;
            esac
          fi
          # Release title as in 1.0.0-beta.1; the build job already checked tag == v<package version>.
          version="${REF_NAME#v}"
          case "$version" in *-*) name="Lila Modeler $version (prerelease)" ;; *) name="Lila Modeler $version" ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # An empty body_path keeps the action's default (no body).
          if [ -f candidate/notes.md ]; then echo "body_path=candidate/notes.md" >> "$GITHUB_OUTPUT"; fi
          ls -laR candidate
      - uses: softprops/action-gh-release@v2 # the repository allowlist only admits this pattern, not a SHA pin
        with:
          name: ${{ steps.guard.outputs.name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: false
          body_path: ${{ steps.guard.outputs.body_path }}
          files: |
            candidate/assets/*-mac-arm64.dmg
            candidate/assets/*-win-x64.exe
            candidate/assets/SHA256SUMS
          fail_on_unmatched_files: true
