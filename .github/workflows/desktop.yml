name: Desktop

# Empaqueta la SPA con electron-builder por commit, sin certificados (sin firma,
# ver #109/E19). Se dispara manualmente, en PR que tocan apps/desktop (sin publicar, para no
# cargar cada PR con una compilación de instaladores) y en tags v* (publica
# un GitHub Release en borrador con los tres instaladores para que Brito lo revise).
# Cortar una release: `git tag v0.0.1 && git push origin v0.0.1`. El Release queda en
# BORRADOR: hay que publicarlo a mano desde la web. Ojo: la versión del nombre de los
# instaladores sale de `apps/desktop/package.json` (hoy 0.0.1), no del tag — súbela ahí
# antes de etiquetar o dos tags distintos producirán ficheros con el mismo nombre.
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @lila/engine
      - run: npm run build -w @lila/web
      - run: npm run build -w @lila/desktop
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lila-desktop-${{ matrix.os }}-${{ github.sha }}
          path: apps/desktop/release/**
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: apps/desktop/release/*.{dmg,exe,AppImage}
          draft: true
          fail_on_unmatched_files: true
