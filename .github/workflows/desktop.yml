name: Desktop

# Build unsigned installers on PRs and manual runs. Tags create a draft release.
# The owner approves publication and creates v0.1.0 only after validation.
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @lila/engine
      - run: npm run build -w @lila/web
      - run: npm run build -w @lila/desktop
      - run: npx electron-builder ${{ matrix.flag }} --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lila-desktop-${{ matrix.os }}-${{ github.sha }}
          path: apps/desktop/release/**
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: apps/desktop/release/*.{dmg,exe,AppImage}
          draft: true
          fail_on_unmatched_files: true
