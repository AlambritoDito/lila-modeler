name: Desktop

# Build unsigned installers on PRs and manual runs. A `v*` tag additionally attaches the
# macOS arm64 DMG and its checksum to a DRAFT PRERELEASE; the owner reviews the assets and
# publishes the release manually. Windows and Linux builds stay CI artifacts only: they are
# built but not validated, so they are not advertised as release assets.
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: --mac --arm64
          - os: windows-latest
            flags: --win
          - os: ubuntu-latest
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w @lila/engine
      - run: npm run build -w @lila/web
      - run: npm run build -w @lila/desktop
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        working-directory: apps/desktop
      - name: Verify macOS artifact is arm64 and carries the tagged version
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dmg=$(ls release/*-mac-arm64.dmg)
          echo "DMG: $dmg"
          case "$dmg" in *"-${version}-mac-arm64.dmg") ;; *) echo "DMG name does not carry version $version"; exit 1;; esac
          binary="release/mac-arm64/Lila Modeler.app/Contents/MacOS/Lila Modeler"
          lipo -archs "$binary" | tee /dev/stderr | grep -qw arm64
          plist="release/mac-arm64/Lila Modeler.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          (cd release && shasum -a 256 *-mac-arm64.dmg > SHA256SUMS && cat SHA256SUMS)
          cat release/ORIGEN.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: lila-desktop-${{ matrix.os }}-${{ github.sha }}
          path: apps/desktop/release/**
          if-no-files-found: error
      # Only the validated platform reaches the release, and only as a draft prerelease.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        with:
          draft: true
          prerelease: true
          files: |
            apps/desktop/release/*-mac-arm64.dmg
            apps/desktop/release/SHA256SUMS
          fail_on_unmatched_files: true
